[project]
name = "image2-admin-server"
version = "0.1.0"
description = "Admin FastAPI service for the image AI editing platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "cryptography>=42",
    "email-validator>=2.1",
    "fastapi>=0.110",
    "minio>=7.2",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "redis>=5",
    "SQLAlchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
