# Deployment drain: reject only new image jobs while existing jobs and polling
# finish. Operators toggle /var/run/image2-deploy-drain inside this container.
map "$image2_deploy_drain:$request_method:$uri" $image2_reject_new_task {
    default 0;
    ~^on:POST:/api/image-tasks(/batch|/batch-upload|/batches/retry)?/?$ 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 65m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    set $image2_deploy_drain off;
    if (-f /var/run/image2-deploy-drain) {
        set $image2_deploy_drain on;
    }
    if ($image2_reject_new_task) {
        return 503 '{"code":50300,"message":"系统正在更新，请稍后提交新任务","data":null}';
    }

    # Prompt optimization is streamed as SSE. Disable Nginx buffering so each
    # upstream token reaches the browser as it is produced.
    location = /api/prompt/optimize/stream {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $user_api_upstream http://user-server:8000;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $user_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Image2-Site-Key "";
        proxy_buffering off;
        proxy_cache off;
    }

    # Keep the base endpoint on HTTPS via a relative redirect. Without this
    # exact match, Nginx's automatic slash redirect uses the internal HTTP
    # scheme and API clients can enter an http/https redirect loop.
    location = /v1 {
        return 308 /v1/;
    }

    # Public OpenAI-compatible gateway. Keep the original /v1 path and disable
    # buffering so SSE chunks reach CLI clients without delay.
    location /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $user_api_upstream http://user-server:8000;

        proxy_pass $user_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Image2-Site-Key "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 500m;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $user_api_upstream http://user-server:8000;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $user_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Image2-Site-Key "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $user_uploads_upstream http://user-server:8000;

        rewrite ^/uploads/(.*)$ /uploads/$1 break;
        proxy_pass $user_uploads_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Image2-Site-Key "";
    }

    # Vite emits content-hashed filenames, so these files are immutable.
    location /canvas-app/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /canvas-app/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self'";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
