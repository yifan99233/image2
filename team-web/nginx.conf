server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # The customer site key is accepted only as a URL path segment and is
    # injected by this internal proxy. The user-server never sees a client
    # supplied value from this public edge.
    location ~ ^/(?<site_key>[A-Za-z0-9_-]+)/api/(?<api_path>.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $user_api_upstream http://user-server:8000;

        proxy_pass $user_api_upstream/$api_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Image2-Site-Key $site_key;
    }

    # `base: ./` makes Vite assets resolve under /<site_key>/assets. Strip the
    # tenant prefix before serving static files, while keeping the browser URL.
    location ~ ^/[A-Za-z0-9_-]+/(.+)$ {
        rewrite ^/[A-Za-z0-9_-]+/(.+)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/[A-Za-z0-9_-]+/?$ {
        try_files /index.html =404;
    }

    # A shared login URL can carry the target tenant in `redirect`, for example
    # /login?redirect=/sqcm/. The client resolves that tenant before issuing API
    # requests and then returns to its canonical scoped URL after login.
    location ~ ^/login/?$ {
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location = /image2ai-icon.svg {
        try_files $uri =404;
    }

    location = /brand-icon.png {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
