[project]
name = "image2-user-server"
version = "0.1.0"
description = "User-facing FastAPI service for the image AI editing platform."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "anyio>=4.0.0",
  "asyncpg>=0.29.0",
  "cryptography>=42.0.0",
  "email-validator>=2.1.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "minio>=7.2.0",
  "pydantic-settings>=2.2.0",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3.0",
  "redis>=5.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.30.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "Pillow>=11.0.0",
  "xlsxwriter>=3.2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
