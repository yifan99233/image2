# Magic image2 .com aliases migrated to V3.
map $http_upgrade $connection_upgrade_magic_com {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name magic.shyfai.com magic-admin.shyfai.com magic-art.shyfai.com magic-admin-art.shyfai.com magic-lqcm.shyfai.com magic-lqcm-admin.shyfai.com magic-sot.shyfai.com magic-admin-sot.shyfai.com team.shyfai.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name magic.shyfai.com magic-art.shyfai.com magic-lqcm.shyfai.com magic-sot.shyfai.com;
    client_max_body_size 500m;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/magic.shyfai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magic.shyfai.com/privkey.pem;
    location /image2-assets/ {
        proxy_pass http://127.0.0.1:9002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_magic_com;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name magic-admin.shyfai.com magic-admin-art.shyfai.com magic-lqcm-admin.shyfai.com magic-admin-sot.shyfai.com;
    client_max_body_size 500m;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/magic.shyfai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magic.shyfai.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_magic_com;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name team.shyfai.com;
    client_max_body_size 20m;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/magic.shyfai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magic.shyfai.com/privkey.pem;
    location = / { return 302 /main/; }
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_magic_com;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
