# Public TLS terminates at V4 for ccai.fycsai.com and admin.ccai.fycsai.com.
# V4 verifies V3 using SNI magic.shyfai.cn and retains the CCAI HTTP Host.
# These vhosts reuse V3's existing TLS policy; do not direct public DNS to V3.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ccai.fycsai.com;
    client_max_body_size 500m;
    ssl_certificate /etc/letsencrypt/live/magic.shyfai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magic.shyfai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;

    location /image2-assets/ {
        proxy_pass http://127.0.0.1:9002;
    }
    location / {
        proxy_pass http://127.0.0.1:3002;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.ccai.fycsai.com;
    client_max_body_size 500m;
    ssl_certificate /etc/letsencrypt/live/magic.shyfai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magic.shyfai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
