server {
    listen 80;
    listen [::]:80;
    server_name magic.shyfai.com magic-admin.shyfai.com team.shyfai.com
        magic-art.shyfai.com magic-admin-art.shyfai.com
        magic-lqcm.shyfai.com magic-lqcm-admin.shyfai.com
        magic-sot.shyfai.com magic-admin-sot.shyfai.com
        ~^magic-(?!admin-)[a-z0-9][a-z0-9-]*\.shyfai\.com$
        ~^magic-admin-[a-z0-9][a-z0-9-]*\.shyfai\.com$;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name magic.shyfai.com magic-art.shyfai.com magic-lqcm.shyfai.com magic-sot.shyfai.com
        ~^magic-(?!admin-)[a-z0-9][a-z0-9-]*\.shyfai\.com$;
    client_max_body_size 500m;

    ssl_certificate /etc/letsencrypt/live/shyfai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shyfai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /image2-assets/ {
        proxy_pass http://127.0.0.1:9002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

