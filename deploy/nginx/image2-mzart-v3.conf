# V3: install through Git, then symlink from sites-enabled/image2-mzart.
# The mzart tenant shares the running image2 stack; preserve the public Host.
server {
    listen 80;
    listen [::]:80;
    server_name mzart.hzpicai.com mzart-admin.hzpicai.com mzart-team.hzpicai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mzart.hzpicai.com;
    client_max_body_size 500m;
    include /data/workspace/image2/deploy/nginx/includes/mzart-tls.inc;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;
    include /etc/nginx/snippets/image2-maintenance.inc;

    location /image2-assets/ {
        proxy_pass http://127.0.0.1:9002;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mzart-admin.hzpicai.com;
    client_max_body_size 20m;
    include /data/workspace/image2/deploy/nginx/includes/mzart-tls.inc;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;
    include /etc/nginx/snippets/image2-maintenance.inc;

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mzart-team.hzpicai.com;
    client_max_body_size 20m;
    include /data/workspace/image2/deploy/nginx/includes/mzart-tls.inc;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;
    include /etc/nginx/snippets/image2-maintenance.inc;

    # The existing team app scopes API calls using the first path segment.
    location = / { return 302 /mzart/; }
    location = /mzart { return 302 /mzart/; }
    location = /login { return 302 /mzart/; }
    location = /login/ { return 302 /mzart/; }

    location /mzart/ {
        proxy_pass http://127.0.0.1:3003;
    }

    location = /image2ai-icon.svg {
        proxy_pass http://127.0.0.1:3003;
    }

    location = /brand-icon.png {
        proxy_pass http://127.0.0.1:3003;
    }

    # This dedicated hostname only serves its own tenant's console.
    location / { return 404; }
}
