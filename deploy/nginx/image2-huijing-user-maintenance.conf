# Temporary maintenance for the Huijing frontend domain cutover only.
# Huijing uses the shared V3 image2 service with independent tenant data.
server {
    listen 80;
    listen [::]:80;
    server_name hzhjai.com www.hzhjai.com art.hzhjai.com admin.hzhjai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hzhjai.com;
    include /data/workspace/image2/deploy/nginx/includes/huijing-tls.inc;
    return 308 https://hzhjai.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hzhjai.com art.hzhjai.com;
    client_max_body_size 500m;
    include /data/workspace/image2/deploy/nginx/includes/huijing-tls.inc;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;
    include /etc/nginx/snippets/image2-maintenance.inc;

    location /image2-assets/ { proxy_pass http://127.0.0.1:9002; }
    location / {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 60 always;
        return 503 "系统维护中，请稍后再试";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.hzhjai.com;
    client_max_body_size 20m;
    include /data/workspace/image2/deploy/nginx/includes/huijing-tls.inc;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;
    include /etc/nginx/snippets/image2-maintenance.inc;

    location / { proxy_pass http://127.0.0.1:3001; }
}
