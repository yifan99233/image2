# 艾全服: tenant aqf on the shared Magic application.
server {
    listen 80;
    listen [::]:80;
    server_name magic-aqf.shyfai.cn magic-admin-aqf.shyfai.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name magic-aqf.shyfai.cn;
    client_max_body_size 500m;

    include /etc/nginx/snippets/tls-shyfai-wildcard.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/image2-maintenance.inc;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;

    location /image2-assets/ {
        proxy_pass http://127.0.0.1:9002;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name magic-admin-aqf.shyfai.cn;
    client_max_body_size 500m;

    include /etc/nginx/snippets/tls-shyfai-wildcard.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/image2-maintenance.inc;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
