# Dreave's existing site (site_configs.id=7) shares the running V3 image2 stack.
# Install through Git and symlink into sites-enabled. Preserve Host for tenancy.
server {
    listen 80;
    listen [::]:80;
    server_name magic-dreave.shyfai.com magic-admin-dreave.shyfai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name magic-dreave.shyfai.com;
    client_max_body_size 500m;
    include /data/workspace/image2/deploy/nginx/includes/shyfai-com-tls.inc;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;

    location /image2-assets/ {
        proxy_pass http://127.0.0.1:9002;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name magic-admin-dreave.shyfai.com;
    client_max_body_size 20m;
    include /data/workspace/image2/deploy/nginx/includes/shyfai-com-tls.inc;
    include /data/workspace/image2/deploy/nginx/includes/image2-proxy.inc;

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
