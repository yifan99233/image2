# Domestic edge for the lqcm user, admin, and shared team entry points.
#
# Each public .cn host has its own upstream keepalive pool to the existing Hong
# Kong HTTPS edge. Keeping the pools separate is required because the Hong Kong
# virtual hosts use different TLS certificates.

map $http_upgrade $magic_lqcm_cn_connection_upgrade {
    default upgrade;
    ""      "";
}

proxy_cache_path /var/cache/nginx/magic-lqcm-cn
    levels=1:2
    keys_zone=magic_lqcm_cn_static:16m
    max_size=4g
    inactive=30d
    use_temp_path=off;

upstream magic_lqcm_cn_hk_user_edge {
    server 45.145.228.74:443 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream magic_lqcm_cn_hk_admin_edge {
    server 45.145.228.74:443 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream magic_lqcm_cn_hk_team_edge {
    server 45.145.228.74:443 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name magic-lqcm.shyfai.cn magic-lqcm-admin.shyfai.cn team.shyfai.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name magic-lqcm.shyfai.cn;
    client_max_body_size 500m;
    set $magic_lqcm_cn_hk_edge_host magic-lqcm.shyfai.com;

    include /etc/nginx/snippets/tls-shyfai-wildcard.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        proxy_pass https://magic_lqcm_cn_hk_user_edge;
        include /mnt/work/image2/deploy/nginx/includes/magic-lqcm-cn-hk-microcache.inc;
    }

    location ~* ^/(?:[A-Za-z0-9_-]+/)?(?:assets|image2-assets)/ {
        proxy_pass https://magic_lqcm_cn_hk_user_edge;
        include /mnt/work/image2/deploy/nginx/includes/magic-lqcm-cn-hk-static.inc;
    }

    location / {
        proxy_pass https://magic_lqcm_cn_hk_user_edge;
        include /mnt/work/image2/deploy/nginx/includes/magic-lqcm-cn-hk-dynamic.inc;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name magic-lqcm-admin.shyfai.cn;
    client_max_body_size 500m;
    set $magic_lqcm_cn_hk_edge_host magic-lqcm-admin.shyfai.org;

    include /etc/nginx/snippets/tls-shyfai-wildcard.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        proxy_pass https://magic_lqcm_cn_hk_admin_edge;
        include /mnt/work/image2/deploy/nginx/includes/magic-lqcm-cn-hk-microcache.inc;
    }

    location ~* ^/(?:[A-Za-z0-9_-]+/)?(?:assets|image2-assets)/ {
        proxy_pass https://magic_lqcm_cn_hk_admin_edge;
        include /mnt/work/image2/deploy/nginx/includes/magic-lqcm-cn-hk-static.inc;
    }

    location / {
        proxy_pass https://magic_lqcm_cn_hk_admin_edge;
        include /mnt/work/image2/deploy/nginx/includes/magic-lqcm-cn-hk-dynamic.inc;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name team.shyfai.cn;
    client_max_body_size 500m;
    set $magic_lqcm_cn_hk_edge_host team.shyfai.com;

    include /etc/nginx/snippets/tls-shyfai-wildcard.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        proxy_pass https://magic_lqcm_cn_hk_team_edge;
        include /mnt/work/image2/deploy/nginx/includes/magic-lqcm-cn-hk-microcache.inc;
    }

    location ~* ^/(?:[A-Za-z0-9_-]+/)?(?:assets|image2-assets)/ {
        proxy_pass https://magic_lqcm_cn_hk_team_edge;
        include /mnt/work/image2/deploy/nginx/includes/magic-lqcm-cn-hk-static.inc;
    }

    location / {
        proxy_pass https://magic_lqcm_cn_hk_team_edge;
        include /mnt/work/image2/deploy/nginx/includes/magic-lqcm-cn-hk-dynamic.inc;
    }
}
