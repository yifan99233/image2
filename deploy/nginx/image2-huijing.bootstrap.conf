# Initial HTTP-only entry for Let's Encrypt HTTP-01 verification.
server {
    listen 80;
    listen [::]:80;
    server_name hzhjai.com www.hzhjai.com art.hzhjai.com admin.hzhjai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        default_type text/plain;
        add_header Retry-After 60 always;
        return 503 "站点正在准备中，请稍后再试。\n";
    }
}
