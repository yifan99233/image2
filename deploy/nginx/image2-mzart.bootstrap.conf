# Enable only until certbot has issued the three-host SAN certificate.
server {
    listen 80;
    listen [::]:80;
    server_name mzart.hzpicai.com mzart-admin.hzpicai.com mzart-team.hzpicai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 503;
    }
}
