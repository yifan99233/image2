server {
    listen 80;
    listen [::]:80;
    server_name agent2.shyfai.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agent2.shyfai.cn;
    client_max_body_size 500m;

    include /etc/nginx/snippets/tls-shyfai-wildcard.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /www/wwwlogs/agent2.shyfai.cn.log;
    error_log /www/wwwlogs/agent2.shyfai.cn.error.log;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '{"code":"INSUFFICIENT_BALANCE","message":"Insufficient account balance"}' '{"code":"INSUFFICIENT_BALANCE","message":"账户余额不足，请打开 agent2.shyfai.cn 登录账号后在充值/订阅模块下充值金额后再使用"}';
    }
}

