# Route dynamic image2 user/admin tenant aliases before applying the corporate
# site fallback. A wildcard server_name has higher precedence than regex
# server names, so this shared wildcard vhost owns the dynamic routing.
map $host $shyfai_cn_image2_upstream {
    default           "";
    ~^magic-admin-    http://127.0.0.1:3001;
    ~^magic-          http://127.0.0.1:3002;
}

map $shyfai_cn_image2_upstream $shyfai_cn_is_image2_host {
    default    1;
    ""         0;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.shyfai.cn;

    if ($shyfai_cn_is_image2_host = 1) {
        return 301 https://$host$request_uri;
    }

    return 301 https://shyfai.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.shyfai.cn;
    client_max_body_size 500m;

    include /etc/nginx/snippets/tls-shyfai-wildcard.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($shyfai_cn_is_image2_host = 0) {
        return 301 https://shyfai.cn$request_uri;
    }

    include /etc/nginx/snippets/image2-maintenance.inc;

    location /image2-assets/ {
        proxy_pass http://127.0.0.1:9002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass $shyfai_cn_image2_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
