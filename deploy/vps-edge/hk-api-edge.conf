# Independent Hong Kong entry points. Pin origins so DNS changes cannot loop.
map $http_upgrade $hk_api_connection_upgrade {
    default upgrade;
    "" "";
}

map $host $hk_api_origin_host {
    default "";
    hk-agent3.shyfai.cn agent3.shyfai.cn;
    hk-yy.shagentai.com yy.shagentai.com;
    hk-agent.shyfai.com agent.shyfai.com;
    hk.hzpixai.com hzpixai.com;
}

map $host $hk_api_upstream {
    default "";
    hk-agent3.shyfai.cn hk_api_agent3_origin;
    hk-yy.shagentai.com hk_api_yy_origin;
    hk-agent.shyfai.com hk_api_agent_origin;
    hk.hzpixai.com hk_api_hzpixai_origin;
}

# Same-origin browser requests must agree with the canonical upstream Host.
# Other origins remain unchanged, preserving the origin's CORS policy.
map $http_origin $hk_api_origin {
    default $http_origin;
    https://hk-agent3.shyfai.cn https://agent3.shyfai.cn;
    https://hk-yy.shagentai.com https://yy.shagentai.com;
    https://hk-agent.shyfai.com https://agent.shyfai.com;
    https://hk.hzpixai.com https://hzpixai.com;
}

map $http_referer $hk_api_referer {
    default $http_referer;
    ~^https://hk-agent3\.shyfai\.cn(?<hk_api_agent3_path>/.*)$ https://agent3.shyfai.cn$hk_api_agent3_path;
    ~^https://hk-yy\.shagentai\.com(?<hk_api_yy_path>/.*)$ https://yy.shagentai.com$hk_api_yy_path;
    ~^https://hk-agent\.shyfai\.com(?<hk_api_agent_path>/.*)$ https://agent.shyfai.com$hk_api_agent_path;
    ~^https://hk\.hzpixai\.com(?<hk_api_hzpixai_path>/.*)$ https://hzpixai.com$hk_api_hzpixai_path;
}

map $upstream_http_access_control_allow_origin $hk_api_allow_origin {
    default $upstream_http_access_control_allow_origin;
    https://agent3.shyfai.cn https://hk-agent3.shyfai.cn;
    https://yy.shagentai.com https://hk-yy.shagentai.com;
    https://agent.shyfai.com https://hk-agent.shyfai.com;
    https://hzpixai.com https://hk.hzpixai.com;
}

# Separate keepalive pools preserve the origin TLS identity on reused sockets.
upstream hk_api_agent3_origin {
    server 159.195.17.59:443;
    keepalive 32;
}

upstream hk_api_yy_origin {
    server 159.195.232.157:443;
    keepalive 32;
}

upstream hk_api_agent_origin {
    server 159.195.232.157:443;
    keepalive 32;
}

upstream hk_api_hzpixai_origin {
    server 159.195.232.157:443;
    keepalive 32;
}

# Exclude query strings, credentials and cookies from diagnostic logs.
log_format hk_api_edge escape=json
    '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
    '"uri":"$uri","status":$status,"request_id":"$request_id",'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

server {
    listen 80;
    listen [::]:80;
    server_name hk-agent3.shyfai.cn hk-yy.shagentai.com hk-agent.shyfai.com hk.hzpixai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    # Match the shared listener flags used by the existing Magic edge.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hk-agent3.shyfai.cn hk-yy.shagentai.com hk-agent.shyfai.com hk.hzpixai.com;

    ssl_certificate /etc/letsencrypt/live/hk-api-edge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hk-api-edge/privkey.pem;
    ssl_session_cache shared:hk_api_tls:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500m;
    access_log /var/log/nginx/hk-api-edge.access.log hk_api_edge;
    error_log /var/log/nginx/hk-api-edge.error.log;

    if ($hk_api_origin_host = "") {
        return 421;
    }

    location / {
        proxy_pass https://$hk_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $hk_api_origin_host;
        proxy_set_header Origin $hk_api_origin;
        proxy_set_header Referer $hk_api_referer;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hk_api_connection_upgrade;

        proxy_ssl_server_name on;
        proxy_ssl_name $hk_api_origin_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;
        proxy_connect_timeout 15s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Preserve streaming responses and uploads, and never retry paid POSTs.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;

        proxy_redirect https://$hk_api_origin_host/ https://$host/;
        proxy_redirect http://$hk_api_origin_host/ https://$host/;
        proxy_cookie_domain $hk_api_origin_host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $hk_api_allow_origin always;
        add_header X-HK-Edge hk-api-edge always;
        add_header X-HK-Request-ID $request_id always;
    }
}
