# Temporary HTTP-only challenge site; remove when the shared TLS site includes
# hk-agent.shyfai.com. Existing Hong Kong entry points stay on their TLS site.
server {
    listen 80;
    listen [::]:80;
    server_name hk-agent.shyfai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 60 always;
        return 503;
    }
}
