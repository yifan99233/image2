# Dedicated accelerated entries for selected magic-*.shyfai.com sites.
#
# Public .com hostnames terminate on the Hong Kong VPS. Requests are sent to
# the fixed production IP with the equivalent .cn Host and TLS SNI, avoiding a
# DNS loop after each exact .com record is moved to this edge.

map $http_upgrade $magic_com_connection_upgrade {
    default upgrade;
    ""      "";
}

map $host $magic_com_origin_host {
    magic-yy.shyfai.com   magic-yy.shyfai.cn;
    magic-lqcm.shyfai.com magic-lqcm.shyfai.cn;
    team.shyfai.com       team.shyfai.cn;
    default               "";
}

map $http_origin $magic_com_origin_header {
    default "https://$magic_com_origin_host";
    ""      "";
}

map $http_referer $magic_com_referer_header {
    default "https://$magic_com_origin_host/";
    ""      "";
}

proxy_cache_path /var/cache/nginx/magic-com
    levels=1:2
    keys_zone=magic_com_static:16m
    max_size=4g
    inactive=30d
    use_temp_path=off;

upstream magic_com_cn_origin {
    server 159.195.17.59:443 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name magic-yy.shyfai.com magic-lqcm.shyfai.com team.shyfai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name magic-yy.shyfai.com magic-lqcm.shyfai.com team.shyfai.com;

    ssl_certificate /etc/letsencrypt/live/magic-com-edge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magic-com-edge/privkey.pem;
    ssl_session_cache shared:magic_com_tls:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location ~ (^|/)\. {
        return 404;
    }

    if ($magic_com_origin_host = "") {
        return 444;
    }

    location ~* /assets/ {
        proxy_pass https://magic_com_cn_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $magic_com_origin_host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name $magic_com_origin_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_cache magic_com_static;
        proxy_cache_key "$host$uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 30d;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Edge-Cache $upstream_cache_status always;
    }

    location ~* ^/(?:[a-z0-9_-]+/)?(?:image2ai-icon\.svg|brand-icon\.png)$ {
        proxy_pass https://magic_com_cn_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $magic_com_origin_host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name $magic_com_origin_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_cache magic_com_static;
        proxy_cache_key "$host$uri";
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 30d;

        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Edge-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass https://magic_com_cn_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $magic_com_origin_host;
        proxy_set_header Origin $magic_com_origin_header;
        proxy_set_header Referer $magic_com_referer_header;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $magic_com_connection_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_name $magic_com_origin_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;

        proxy_redirect https://$magic_com_origin_host/ https://$host/;
        proxy_cookie_domain shyfai.cn shyfai.com;
        proxy_cookie_domain .shyfai.cn .shyfai.com;
    }
}
