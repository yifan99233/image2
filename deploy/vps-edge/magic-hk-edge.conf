# Hong Kong HTTPS edge for the Magic .com tenant sites.
#
# This edge terminates the public .com certificates and forwards to the
# existing V3 image2 gateway. The origin is selected by TLS SNI so the V3
# wildcard/exact .cn virtual hosts route the request to the correct app while
# the original .com Host remains visible to the application.

map $http_upgrade $magic_hk_connection_upgrade {
    default upgrade;
    ""      close;
}

map $host $magic_hk_origin_sni {
    default                         magic.shyfai.cn;

    magic-admin.shyfai.com         magic-admin.shyfai.cn;
    magic-admin-art.shyfai.com     magic-admin-art.shyfai.cn;
    magic-lqcm-admin.shyfai.com    magic-lqcm-admin.shyfai.cn;
    magic-admin-sot.shyfai.com     magic-admin-sot.shyfai.cn;
    magic-admin-sg.shyfai.com      magic-admin.shyfai.cn;
    magic-admin-cc.shyfai.com      magic-admin.shyfai.cn;
    magic-admin-yy.shyfai.com      magic-admin.shyfai.cn;
    magic-admin-cf.shyfai.com      magic-admin.shyfai.cn;
    magic-aqf.shyfai.com           magic-aqf.shyfai.cn;
    magic-admin-aqf.shyfai.com     magic-admin-aqf.shyfai.cn;

    team.shyfai.com                team.shyfai.cn;
    magic-dreave.shyfai.com        magic-dreave.shyfai.com;
    magic-admin-dreave.shyfai.com  magic-admin-dreave.shyfai.com;
    # V3 presents the magic.shyfai.com certificate for the CCAI vhosts;
    # keep the original CCAI Host header while using this matching SNI.
    ccai.fycsai.com                magic.shyfai.com;
    admin.ccai.fycsai.com          magic.shyfai.com;
}

upstream magic_hk_v3_origin {
    server 38.147.104.202:443 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name
        magic.shyfai.com magic-admin.shyfai.com
        magic-art.shyfai.com magic-admin-art.shyfai.com
        magic-lqcm.shyfai.com magic-lqcm-admin.shyfai.com
        magic-sot.shyfai.com magic-admin-sot.shyfai.com
        magic-sg.shyfai.com magic-admin-sg.shyfai.com
        magic-cc.shyfai.com magic-admin-cc.shyfai.com
        magic-yy.shyfai.com magic-admin-yy.shyfai.com
        magic-cf.shyfai.com magic-admin-cf.shyfai.com
        magic-aqf.shyfai.com magic-admin-aqf.shyfai.com
        magic-dreave.shyfai.com magic-admin-dreave.shyfai.com
        ccai.fycsai.com admin.ccai.fycsai.com
        team.shyfai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name
        magic.shyfai.com
        magic-art.shyfai.com
        magic-lqcm.shyfai.com
        magic-sot.shyfai.com
        magic-sg.shyfai.com
        magic-cc.shyfai.com
        magic-yy.shyfai.com
        magic-cf.shyfai.com
        magic-aqf.shyfai.com
        magic-dreave.shyfai.com
        ccai.fycsai.com;

    ssl_certificate /etc/letsencrypt/live/magic-hk-edge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magic-hk-edge/privkey.pem;
    ssl_session_cache shared:magic_hk_tls:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500m;

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        proxy_pass https://magic_hk_v3_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $magic_hk_connection_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_name $magic_hk_origin_sni;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_redirect https://$magic_hk_origin_sni/ https://$host/;
        proxy_cookie_domain shyfai.cn shyfai.com;
        proxy_cookie_domain .shyfai.cn .shyfai.com;
    }
}

