# Hong Kong edge gateway for shyfai.org.
#
# Browser-facing hosts keep their .org name while the origin application sees
# the equivalent .com host. This keeps tenant resolution, cookies, and CORS
# compatible without adding .org aliases to the application.

map $http_upgrade $shyfai_edge_connection_upgrade {
    default upgrade;
    ""      "";
}

map $host $shyfai_edge_origin_host {
    hostnames;
    shyfai.org shyfai.com;
    ~^(?<shyfai_edge_label>[a-z0-9][a-z0-9-]*)\.shyfai\.org$ $shyfai_edge_label.shyfai.com;
    default "";
}

map $http_origin $shyfai_edge_origin_header {
    default "https://$shyfai_edge_origin_host";
    ""      "";
}

map $http_referer $shyfai_edge_referer_header {
    default "https://$shyfai_edge_origin_host/";
    ""      "";
}

proxy_cache_path /var/cache/nginx/shyfai-org
    levels=1:2
    keys_zone=shyfai_org_static:32m
    max_size=8g
    inactive=30d
    use_temp_path=off;

upstream shyfai_com_origin {
    server 159.195.17.59:443 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name shyfai.org *.shyfai.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shyfai.org *.shyfai.org;

    ssl_certificate /etc/letsencrypt/live/shyfai.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shyfai.org/privkey.pem;
    ssl_session_cache shared:shyfai_edge_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    if ($shyfai_edge_origin_host = "") {
        return 444;
    }

    # Never forward hidden files such as .env or .git to the origin. The SPA
    # fallback would otherwise return index.html with a misleading 200 status.
    location ~ (^|/)\. {
        return 404;
    }

    # Vite emits content-hashed files below /assets/. Team pages include their
    # tenant prefix in front of /assets/, so a regex location covers both.
    location ~* /assets/ {
        proxy_pass https://shyfai_com_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $shyfai_edge_origin_host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name $shyfai_edge_origin_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_cache shyfai_org_static;
        proxy_cache_key "$host$uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 30d;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Edge-Cache $upstream_cache_status always;
    }

    location ~* ^/(?:[a-z0-9_-]+/)?(?:image2ai-icon\.svg|brand-icon\.png)$ {
        proxy_pass https://shyfai_com_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $shyfai_edge_origin_host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name $shyfai_edge_origin_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_cache shyfai_org_static;
        proxy_cache_key "$host$uri";
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 30d;

        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Edge-Cache $upstream_cache_status always;
    }

    # Dynamic requests, uploads, WebSockets, and SSE are streamed directly.
    # The application sees the equivalent .com origin and Host.
    location / {
        proxy_pass https://shyfai_com_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $shyfai_edge_origin_host;
        proxy_set_header Origin $shyfai_edge_origin_header;
        proxy_set_header Referer $shyfai_edge_referer_header;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $shyfai_edge_connection_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_name $shyfai_edge_origin_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;

        proxy_redirect https://$shyfai_edge_origin_host/ https://$host/;
        proxy_cookie_domain shyfai.com shyfai.org;
        proxy_cookie_domain .shyfai.com .shyfai.org;
    }
}
