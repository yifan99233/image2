# HTTP challenge endpoint while the independent API edge certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name hk-agent3.shyfai.cn hk-yy.shagentai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 60 always;
        return 503;
    }
}
